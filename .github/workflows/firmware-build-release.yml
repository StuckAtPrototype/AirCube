name: Firmware Build and Release

"on":
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.semver.outputs.release_version }}
      release_tag: ${{ steps.semver.outputs.release_tag }}
      should_release: ${{ steps.semver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Compute release version (semantic-release dry run)
        id: semver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          if [[ -n "$latest_tag" ]]; then
            current_version="${latest_tag#v}"
          else
            current_version="0.0.0"
          fi

          semrel_log="$(mktemp)"

          npx semantic-release --dry-run --no-ci >"$semrel_log" 2>&1 || {
            cat "$semrel_log"
            exit 1
          }

          next_version="$(sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?).*/\1/ip' "$semrel_log" | tail -n 1)"

          if [[ -n "$next_version" ]]; then
            release_version="$next_version"
            should_release="true"
          else
            release_version="$current_version"
            should_release="false"
          fi

          release_tag="v${release_version}"

          {
            echo "release_version=$release_version"
            echo "release_tag=$release_tag"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

          cat "$semrel_log"

  build-firmware:
    runs-on: ubuntu-latest
    needs: prepare-version
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Initialize ESP-IDF environment
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          echo "/opt/esp/idf/tools:$PATH"
          idf.py --version
  
      - name: Build firmware (ESP32-H2)
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32h2
          idf.py -DPROJECT_VER="${{ needs.prepare-version.outputs.release_version }}" build

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          cp firmware/build/AirCube.bin "out/AirCube_firmware_v${{ needs.prepare-version.outputs.release_version }}.bin"
          cp firmware/build/bootloader/bootloader.bin "out/bootloader_v${{ needs.prepare-version.outputs.release_version }}.bin"
          cp firmware/build/partition_table/partition-table.bin "out/partition-table_v${{ needs.prepare-version.outputs.release_version }}.bin"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ needs.prepare-version.outputs.release_version }}
          path: out/*

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - prepare-version
      - build-firmware
    if: ${{ needs.prepare-version.outputs.should_release == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.prepare-version.outputs.release_version }}
          path: out

      - name: Publish GitHub Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
